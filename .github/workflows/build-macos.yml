name: Build macOS DMG (Separate Architectures)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-x86_64:
    name: Build Intel (x86_64) DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies and build for x86_64
        run: |
          arch -x86_64 /bin/bash -c "
            python -m venv venv_x86
            source venv_x86/bin/activate
            pip install --upgrade pip setuptools wheel
            # 若存在 requirements.txt 则使用，否则手动安装
            if [ -f requirements.txt ]; then
              pip install -r requirements.txt
            else
              pip install PyInstaller PySide6 aiohttp
            fi
            python -m PyInstaller \
              --windowed \
              --name CloudflareScan_x86_64 \
              --icon=cfs.icns \
              --add-data 'cfs.icns:.' \
              --hidden-import=asyncio \
              --hidden-import=aiohttp \
              --hidden-import=PySide6.QtCore \
              --hidden-import=PySide6.QtGui \
              --hidden-import=PySide6.QtWidgets \
              cfs-mac.py
          "

      - name: Create DMG for x86_64
        run: |
          # 移除未信任的 aws/tap（若存在）以消除警告
          brew untap aws/tap 2>/dev/null || true
          brew install create-dmg
          create-dmg \
            --volname "CloudflareScan (Intel)" \
            --volicon cfs.icns \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "CloudflareScan_x86_64.app" 200 190 \
            --hide-extension "CloudflareScan_x86_64.app" \
            --app-drop-link 600 185 \
            "CloudflareScan_Intel.dmg" \
            dist/

      - name: Upload Intel DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudflareScan-Intel
          path: CloudflareScan_Intel.dmg
          retention-days: 7

  build-arm64:
    name: Build Apple Silicon (arm64) DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies and build for arm64
        run: |
          python -m venv venv_arm
          source venv_arm/bin/activate
          pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install PyInstaller PySide6 aiohttp
          fi
          python -m PyInstaller \
            --windowed \
            --name CloudflareScan_arm64 \
            --icon=cfs.icns \
            --add-data 'cfs.icns:.' \
            --hidden-import=asyncio \
            --hidden-import=aiohttp \
            --hidden-import=PySide6.QtCore \
            --hidden-import=PySide6.QtGui \
            --hidden-import=PySide6.QtWidgets \
            cfs-mac.py

      - name: Create DMG for arm64
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install create-dmg
          create-dmg \
            --volname "CloudflareScan (Apple Silicon)" \
            --volicon cfs.icns \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "CloudflareScan_arm64.app" 200 190 \
            --hide-extension "CloudflareScan_arm64.app" \
            --app-drop-link 600 185 \
            "CloudflareScan_AppleSilicon.dmg" \
            dist/

      - name: Upload ARM64 DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudflareScan-ARM64
          path: CloudflareScan_AppleSilicon.dmg
          retention-days: 7
