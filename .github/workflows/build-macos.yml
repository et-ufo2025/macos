name: Build macOS Apps (Separate Architectures)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ========== Intel (x86_64) 构建 ==========
  build-x86_64:
    name: Build Intel (x86_64) Version
    runs-on: macos-13                     # 原生 Intel runner（不再模拟）
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install UPX (optional, for smaller binaries)
        run: brew install upx

      - name: Install dependencies and build
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip setuptools wheel
          # 如果存在 requirements.txt 则安装，否则默认安装
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install PyInstaller PySide6 aiohttp
          fi
          # 使用 UPX 压缩可执行文件，并排除不需要的大模块（减少体积）
          python -m PyInstaller \
            --windowed \
            --name CloudflareScan_x86_64 \
            --icon=cfs.icns \
            --add-data 'cfs.icns:.' \
            --hidden-import=asyncio \
            --hidden-import=aiohttp \
            --hidden-import=PySide6.QtCore \
            --hidden-import=PySide6.QtGui \
            --hidden-import=PySide6.QtWidgets \
            --upx-dir="$(brew --prefix upx)/bin" \
            --strip \
            --exclude-module=tkinter \
            --exclude-module=unittest \
            --exclude-module=test \
            cfs-mac.py

      - name: Create DMG with create-dmg
        run: |
          brew install create-dmg
          create-dmg \
            --volname "CloudflareScan (Intel)" \
            --volicon cfs.icns \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "CloudflareScan_x86_64.app" 200 190 \
            --hide-extension "CloudflareScan_x86_64.app" \
            --app-drop-link 600 185 \
            CloudflareScan_Intel.dmg \
            dist/

      - name: Verify DMG integrity
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/mnt CloudflareScan_Intel.dmg
          hdiutil detach /tmp/mnt
          echo "✅ DMG is valid"

      - name: Upload Intel DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudflareScan-Intel
          path: CloudflareScan_Intel.dmg
          retention-days: 70

  # ========== ARM (Apple Silicon) 构建 ==========
  build-arm64:
    name: Build ARM (Apple Silicon) Version
    runs-on: macos-14                     # 原生 ARM runner（或 macos-latest）
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install UPX
        run: brew install upx

      - name: Install dependencies and build
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install PyInstaller PySide6 aiohttp
          fi
          python -m PyInstaller \
            --windowed \
            --name CloudflareScan_arm64 \
            --icon=cfs.icns \
            --add-data 'cfs.icns:.' \
            --hidden-import=asyncio \
            --hidden-import=aiohttp \
            --hidden-import=PySide6.QtCore \
            --hidden-import=PySide6.QtGui \
            --hidden-import=PySide6.QtWidgets \
            --upx-dir="$(brew --prefix upx)/bin" \
            --strip \
            --exclude-module=tkinter \
            --exclude-module=unittest \
            --exclude-module=test \
            cfs-mac.py

      - name: Create DMG with create-dmg
        run: |
          brew install create-dmg
          create-dmg \
            --volname "CloudflareScan (Apple Silicon)" \
            --volicon cfs.icns \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "CloudflareScan_arm64.app" 200 190 \
            --hide-extension "CloudflareScan_arm64.app" \
            --app-drop-link 600 185 \
            CloudflareScan_AppleSilicon.dmg \
            dist/

      - name: Verify DMG integrity
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/mnt CloudflareScan_AppleSilicon.dmg
          hdiutil detach /tmp/mnt
          echo "✅ DMG is valid"

      - name: Upload ARM DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudflareScan-ARM64
          path: CloudflareScan_AppleSilicon.dmg
          retention-days: 70

  # ========== 创建 Release ==========
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-x86_64, build-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download both DMG artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List downloaded files (debug)
        run: ls -laR release-artifacts

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/CloudflareScan-Intel/CloudflareScan_Intel.dmg
            release-artifacts/CloudflareScan-ARM64/CloudflareScan_AppleSilicon.dmg
          draft: false
          prerelease: false
          generate_release_notes: true   # 自动生成更新说明
