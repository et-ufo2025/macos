name: Build Executables

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # 手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Windows)
        run: |
          pyinstaller --onefile --windowed --name CloudFlareScan --add-data "cfs.ico;." --collect-all PySide6 cfs-mac.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-Windows
          path: dist/CloudFlareScan.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (macOS)
        run: |
          pyinstaller --onefile --windowed --name CloudFlareScan --add-data "cfs.icns:." --collect-all PySide6 cfs-mac.py

      - name: Create .app bundle (macOS)
        run: |
          cd dist
          zip -r CloudFlareScan-macOS.zip CloudFlareScan.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-macOS
          path: dist/CloudFlareScan-macOS.zip
